spring:
  application:
    name: where-is-my-ferry-backend-test
  datasource:
    url: jdbc:h2:mem:ferrydb_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ferry:
  simulation:
    daemon-url: http://127.0.0.1:8000
    connect-timeout-ms: 1000
    read-timeout-ms: 1000

jwt:
  secret: whereismyferrysupersecretkeyforjwttokengenerationshouldbeatleast256bitslong!
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

app:
  jwt:
    secret: whereismyferrysupersecretkeyforjwttokengenerationshouldbeatleast256bitslong!
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: http://localhost:5173
  admin:
    seed:
      enabled: true
      email: admin@example.com
      password: AdminPass123!

