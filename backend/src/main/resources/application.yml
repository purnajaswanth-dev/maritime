server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: where-is-my-ferry-backend
  datasource:
    url: jdbc:h2:mem:ferrydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ferry:
  simulation:
    daemon-url: ${SIMULATION_DAEMON_URL:http://127.0.0.1:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:whereismyferrysupersecretkeyforjwttokengenerationshouldbeatleast256bitslong!}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

