# =============================================================================
# Where Is My Ferry? Application Properties
# =============================================================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ---- DATABASE ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/where_is_my_ferry}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ferry_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ferry_secret_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- SECURITY ----
app.jwt.secret=${APP_JWT_SECRET:whereismyferrysupersecretkeyforjwttokengenerationshouldbeatleast256bitslong!}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

# Legacy property bridges
jwt.secret=${app.jwt.secret}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ---- FIRST ADMIN (created once at first start if no admin exists) ----
app.admin.seed.enabled=true
app.admin.seed.email=${APP_ADMIN_SEED_EMAIL:admin@example.com}
app.admin.seed.password=${APP_ADMIN_SEED_PASSWORD:Admin@PennArBed2026}

# ---- SIMULATION ENGINE ----
ferry.simulation.daemon-url=${SIMULATION_DAEMON_URL:${FERRY_SIMULATION_DAEMON_URL:http://127.0.0.1:8000}}
ferry.simulation.connect-timeout-ms=3000
ferry.simulation.read-timeout-ms=5000

# ---- MANAGEMENT & METRICS ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
