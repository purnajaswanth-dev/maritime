[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "where-is-my-ferry-ml"
version = "0.1.0"
description = "ML Platform and Data Pipelines for Where Is My Ferry? Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Where Is My Ferry Data Engineering Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.9.0",
    "xarray>=2024.1.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
where-is-my-ferry-simulation = "src.simulation.daemon:run_daemon"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
