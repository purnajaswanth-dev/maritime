services:
  postgres:
    image: postgres:16-alpine
    container_name: where_is_my_ferry_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-where_is_my_ferry}
      POSTGRES_USER: ${POSTGRES_USER:-ferry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferry_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferry_user} -d ${POSTGRES_DB:-where_is_my_ferry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ferry_network

  ml-platform:
    build:
      context: ./ml-platform
      dockerfile: Dockerfile
    container_name: where_is_my_ferry_ml
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ferry_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: where_is_my_ferry_backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-where_is_my_ferry}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ferry_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-ferry_secret_password}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-whereismyferrysupersecretkeyforjwttokengenerationshouldbeatleast256bitslong!}
      - SIMULATION_DAEMON_URL=http://ml-platform:8000
      - FERRY_SIMULATION_DAEMON_URL=http://ml-platform:8000
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      - APP_ADMIN_SEED_EMAIL=${APP_ADMIN_SEED_EMAIL:-admin@example.com}
      - APP_ADMIN_SEED_PASSWORD=${APP_ADMIN_SEED_PASSWORD:-Admin@PennArBed2026}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-platform:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ferry_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: where_is_my_ferry_frontend
    ports:
      - "${PORT:-80}:80"
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ferry_network

volumes:
  postgres_data:
    name: where_is_my_ferry_postgres_data

networks:
  ferry_network:
    name: where_is_my_ferry_network
    driver: bridge
